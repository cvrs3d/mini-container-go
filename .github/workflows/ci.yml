name: Go checks

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format check
        run: |
          test -z "$(gofmt -l main.go main_test.go)"
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Cross-compile ARM64 (the target VM architecture)
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/mini-container-arm64 .
      - name: Check smoke-test shell syntax (do not run privileged tests)
        run: bash -n tests/smoke.sh
